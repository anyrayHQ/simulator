name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # No dependencies to install — that is deliberate, and this keeps it true.
      - name: No runtime dependencies
        run: |
          if node -e "const p=require('./package.json');process.exit(p.dependencies?Object.keys(p.dependencies).length:0)"; then
            echo "ok — a customer can clone and run with no npm install"
          else
            echo "::error::package.json grew a runtime dependency; a customer should not need npm install"
            exit 1
          fi

      # Unit tests plus the full end-to-end run against a mock provider and a
      # mock optimizer. Two cases carry this suite: the dropping optimizer,
      # which proves the quality check can actually fail, and the cold
      # optimizer, which proves we refuse to measure a pipeline that is still
      # loading. If either stops failing when it should, this repo is
      # decorative and CI should say so.
      - name: Tests
        run: npm test

      # The shipped examples are what a customer reads first. They must stay valid.
      - name: Example workloads validate
        run: node prove.mjs --dry-run

      # The privacy claim is a promise in the README, so it is also a test. The
      # optimizer must default to localhost and nothing may reference a host of
      # ours in the request path.
      - name: No Anyray endpoint in the request path
        run: |
          if grep -rnE 'anyray\.ai|api\.anyray' lib/ prove.mjs judge.mjs report.mjs; then
            echo "::error::a proof run must reach only the customer's provider and their local optimizer"
            exit 1
          fi
          echo "ok — the only destinations are the provider and localhost" 
